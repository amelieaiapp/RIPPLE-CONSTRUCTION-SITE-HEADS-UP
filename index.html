<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a2332">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ripple Heads-Up</title>
<script>
/* ============================================================
 * SINGLE SOURCE OF TRUTH for the revision number.
 * WHEN ISSUING AN UPDATE:
 *   1. Change ONLY the string below (e.g. to '0.1.1' or '0.2.0').
 *   2. Save/download the file as RippleHeadsUp_Rev_X_Y_Z.html
 *      (match the dots to underscores; do NOT keep browser's (1)/(2) suffix).
 *   3. The UI title, footer, topbar, core, and module versions all read this.
 * That is the whole process. No hunting through the file.
 * ============================================================ */
window.RIPPLE_REV = '0.1.19';
/* Support contact shown in Help and for Store listing — change the string below */
window.RIPPLE_SUPPORT_EMAIL = 'amelie.ai.support@gmail.com';
window.RIPPLE_SUPPORT_LABEL = 'App support';
</script>
<style>
:root{
  --ink:#1C2126; --ink-2:#2C333A; --paper:#E9ECEE; --surface:#F5F7F8; --line:#C6CDD2;
  --muted:#5C666E; --hivis:#F2A900; --steel:#2B4C6F; --red:#D64B3E; --amber:#E8A33D; --green:#3E9D63;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:var(--sans); background:var(--paper); color:var(--ink); -webkit-text-size-adjust:100%;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px; background-position:-1px -1px; background-blend-mode:normal;}
body::before{content:"";position:fixed;inset:0;background:var(--paper);opacity:.86;z-index:-1}
#app{max-width:880px;margin:0 auto;padding:0 16px 64px}
button{font-family:var(--sans);cursor:pointer;border:none}
.btn{min-height:48px;padding:0 22px;border-radius:2px;font-weight:700;letter-spacing:.02em;font-size:15px;background:var(--ink);color:#fff}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--hivis);color:var(--ink);box-shadow:0 2px 0 #b98400}
.btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);min-height:40px}
.btn:hover{filter:brightness(1.05)}

/* gate + import */
.gate,.import,.errbox{max-width:640px;margin:56px auto 0;padding:34px 30px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--hivis)}
.gate-eyebrow,.import-eyebrow,.err-eyebrow{font:700 12px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--hivis);margin-bottom:14px}
.gate-title{font-size:32px;line-height:1.08;letter-spacing:-.01em;margin:0 0 16px}
.import-title{font-size:26px;margin:0 0 18px}
.gate-lead{font-size:17px;line-height:1.5;color:var(--ink-2);margin:0 0 20px}
.gate-list{list-style:none;padding:0;margin:0 0 22px;border-top:1px solid var(--line)}
.gate-list li{padding:13px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.45;color:var(--ink-2)}
.gate-list strong{color:var(--ink)}
.gate-warn{font-size:15px;line-height:1.45;color:var(--red);font-weight:600;padding:14px 16px;background:rgba(214,75,62,.07);border-left:3px solid var(--red);margin:0 0 24px}
.gate-mantra{font:800 22px/1 var(--sans);letter-spacing:.03em;text-transform:uppercase;color:var(--hivis);margin:0 0 18px}
.gate-region{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 24px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.gate-region-lab{font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.gate-region-btn{min-height:40px;padding:0 15px;background:var(--paper);border:1px solid var(--line);border-radius:2px;font:700 13px var(--sans);color:var(--muted);cursor:pointer}
.gate-region-btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.region-opts{display:flex;flex-direction:column;gap:10px;margin:8px 0 22px}
.region-btn{text-align:left;background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--hivis);padding:16px 18px;cursor:pointer;transition:.12s}
.region-btn:hover{background:#fff;border-left-color:var(--steel)}
.region-name{font:800 17px/1.1 var(--sans)}
.region-eg{font:600 12px/1 var(--mono);color:var(--muted);margin-top:7px}
.app-foot{text-align:center;padding:26px 0 6px;font:700 11px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.app-foot .mantra{color:var(--hivis)}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:44px 20px;border:2px dashed var(--line);background:var(--paper);cursor:pointer;transition:.15s}
.dropzone.over,.dropzone:hover{border-color:var(--hivis);background:#fff}
.dropzone-mark{font:800 34px/1 var(--sans);color:var(--hivis)}
.dropzone-text{font:600 13px/1 var(--mono);letter-spacing:.06em;color:var(--muted)}
.import-hint,.err-msg{font-size:14px;line-height:1.5;color:var(--muted);margin:18px 0 0}
.err-msg{color:var(--ink-2)}

/* topbar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:#fff;margin:0 -16px;padding:12px 16px;position:sticky;top:0;z-index:5}
.topbar-left{display:flex;align-items:center;gap:9px;cursor:pointer}
.topbar-icon{width:28px;height:28px;display:block}
.gate-icon{display:block;width:76px;height:76px;margin:0 0 16px}
.gate-brand{font:800 20px/1 var(--sans);letter-spacing:.06em;margin:0 0 20px;color:var(--ink)}
.import-back{margin:0 0 20px}
.brand{font:800 18px/1 var(--sans);letter-spacing:.06em}
.rev{font:600 11px/1 var(--mono);color:var(--hivis);letter-spacing:.05em}
.topbar-right{display:flex;align-items:center;gap:12px}
.prog-name{font:600 13px/1.2 var(--mono);color:#c9d2d8;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* headline — the signature */
.headline{margin:18px 0;padding:22px 22px 18px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--hivis)}
.headline-stale{border-left-color:var(--red)}
.headline-main{font-size:22px;line-height:1.3;letter-spacing:-.005em}
.headline-main strong{font-weight:800}
.hl-accent{color:var(--steel);font-weight:700}
.hl-tight{color:var(--red)}
.headline-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:flex;flex-direction:column;gap:2px;padding:7px 11px;background:var(--paper);border:1px solid var(--line);border-radius:2px}
.chip-label{font:600 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip-val{font:600 13px/1.2 var(--mono);color:var(--ink)}
.chip-warn{border-color:var(--amber);background:rgba(232,163,61,.1)}
.stale-note{margin-top:12px;font-size:13px;line-height:1.45;color:var(--red);font-weight:600}

/* bands */
.bands{display:flex;gap:6px;margin:6px 0 14px}
.band{flex:1;min-height:46px;background:var(--surface);border:1px solid var(--line);border-radius:2px;font:700 15px/1 var(--mono);letter-spacing:.04em;color:var(--muted)}
.band-on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* look-ahead rows */
.look-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
.look-title{font:600 13px/1.3 var(--mono);letter-spacing:.03em;color:var(--muted);flex:1;min-width:160px}
.look-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:stretch;gap:0;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line)}
.row-driving{border-left-color:var(--red);background:#fdf4f3}
.cell{padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.cell-float{min-width:92px;align-items:flex-start;border-right:1px solid var(--line);background:rgba(43,76,111,.04)}
.float-num{font:700 22px/1 var(--mono);color:var(--steel)}
.float-unit{font:600 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.cell-act{flex:1;gap:4px}
.act-name{font-size:15px;line-height:1.25}
.act-id{font:700 13px/1 var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);padding:2px 5px;border-radius:2px;margin-right:2px}
.act-held{font:600 12px/1 var(--mono);color:var(--steel)}
.cell-act-btn{flex:1;gap:4px;text-align:left;background:transparent;border:none;border-right:1px solid var(--line);cursor:pointer;font-family:var(--sans);color:inherit;min-height:48px}
.cell-act-btn:hover{background:rgba(43,76,111,.06)}
.cell-act-btn.is-open{background:rgba(43,76,111,.08)}
.cell-flag{justify-content:center}
.driving-tag{display:inline-block;font:800 9px/1 var(--mono);letter-spacing:.1em;color:#fff;background:var(--red);padding:3px 6px;border-radius:2px;margin-left:8px;vertical-align:middle}
.dropped-tag{display:inline-block;font:800 9px/1 var(--mono);letter-spacing:.1em;color:var(--muted);background:var(--paper);border:1px solid var(--line);padding:3px 6px;border-radius:2px;margin-left:8px;vertical-align:middle}
.row-dropped{opacity:.52}
.row-dropped .act-name{text-decoration:line-through;text-decoration-color:var(--muted)}
.cell-drop{min-width:78px;align-items:center;justify-content:center;background:transparent;border-left:1px solid var(--line);padding:8px 6px}
.btn-drop{min-height:36px;padding:0 12px;background:#fff;border:1px solid var(--ink);border-radius:2px;font:800 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.btn-drop:hover{background:var(--ink);color:#fff}
.btn-drop.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.empty{padding:26px;text-align:center;color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line)}
/* make-ready light + considerations (separate axis from criticality) */
.lite-frame{font-size:12px;line-height:1.5;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--steel);padding:10px 12px;margin-bottom:10px}
.cell-light{min-width:66px;align-items:center;justify-content:center;background:transparent;border-left:1px solid var(--line);cursor:pointer}
.lite{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.15)}
.lite-green{background:var(--green)} .lite-amber{background:var(--amber)} .lite-red{background:var(--red)}
.row-note{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--steel);padding:14px 16px}
.note-green{border-left-color:var(--green)} .note-amber{border-left-color:var(--amber)} .note-red{border-left-color:var(--red)}
.note-head{font:800 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-bottom:7px}
.note-green .note-head{color:var(--green)} .note-amber .note-head{color:var(--amber)} .note-red .note-head{color:var(--red)}
.note-body{font-size:14px;line-height:1.5;color:var(--ink-2);margin:0 0 12px}
.note-ticks{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.note-foot{font:700 11px/1 var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}

/* make-ready */
.mready{margin-top:26px}
.mready-title{font:800 13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);padding-bottom:8px;border-bottom:2px solid var(--ink);margin-bottom:6px}
.mready-note{font-size:13px;line-height:1.45;color:var(--muted);margin:8px 0 14px}
.mr-card{background:var(--surface);border:1px solid var(--line);padding:12px 14px;margin-bottom:8px}
.mr-top{display:flex;align-items:center;gap:12px}
.mr-light{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.mr-green{background:var(--green)} .mr-amber{background:var(--amber)} .mr-red{background:var(--red)}
.mr-lab{flex:1}
.mr-name{font-size:15px;line-height:1.25}
.mr-sub{font:600 12px/1.3 var(--mono);color:var(--muted);margin-top:2px}
.mr-ticks{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)}
.tick{min-height:36px;padding:0 12px;background:var(--paper);border:1px solid var(--line);border-radius:2px;font:600 12px/1 var(--mono);color:var(--muted)}
.tick-on{background:var(--green);color:#fff;border-color:var(--green)}

/* self-test */
.import-st{background:transparent;color:var(--muted);border:1px solid var(--line);min-height:42px;margin-top:18px}
.st-overlay{position:fixed;inset:0;background:rgba(28,33,38,.62);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.st-card{max-width:520px;width:100%;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--green);padding:26px;max-height:86vh;overflow:auto}
.st-fail{border-top-color:var(--red)}
.st-eyebrow{font:700 12px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
.st-fail .st-eyebrow{color:var(--red)}
.st-score{font:800 30px/1.1 var(--mono);margin:8px 0 18px}
.st-list{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.st-row{display:flex;gap:10px;align-items:baseline;font-size:14px;line-height:1.35}
.st-mark{font:800 15px/1 var(--mono);flex:none} .st-p{color:var(--green)} .st-f{color:var(--red)}
.st-name{color:var(--ink-2)}
.st-note{font-size:13px;line-height:1.45;color:var(--muted);padding:12px 14px;background:var(--paper);border-left:3px solid var(--green);margin-bottom:18px}
.st-fail .st-note{border-left-color:var(--red);color:var(--red);font-weight:600}
/* sketch-pad */
.sketch-back{margin:0 0 14px}

.sk-place-first{font:600 12px var(--mono);color:var(--steel)}

.sketch-fp{font:600 11px/1.5 var(--mono);color:var(--muted);word-break:break-all;background:var(--paper);border-left:3px solid var(--green);padding:9px 12px;margin:0 0 14px}

.sketch-sub-in{width:100%;padding:11px 16px;font:600 14px/1.2 var(--sans);border:1px solid var(--line);border-radius:2px;margin:0 0 12px;background:#fff;color:var(--ink-2)}
.sketch-meta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sketch-pb{flex:1;min-width:160px;padding:11px 14px;font-size:14px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
.sketch-sd{padding:10px 12px;font:600 13px var(--mono);border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
.sketch-keylink{background:transparent;border:none;color:var(--steel);font:600 12px var(--mono);text-decoration:underline;padding:0 0 14px;cursor:pointer;text-align:left;display:block}
.sk-colours{display:flex;gap:4px}
.sk-swatch{width:24px;height:24px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sk-swatch-on{box-shadow:0 0 0 2px var(--ink)}
.ck-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line)}
.ck-dot{width:20px;height:20px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.ck-lab{font-size:14px;color:var(--ink-2)}
.sketch-foot{display:flex;justify-content:flex-end;gap:14px;margin:2px 0 14px;flex-wrap:wrap}
.sketch-foot-by{font:600 11px var(--mono);color:var(--ink-2)}
.sketch-foot-fp{font:600 11px var(--mono);color:var(--muted)}
.sk-print-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:16px}
.sk-print-icon{width:52px;height:52px;flex:none}
.sk-print-titles{flex:1;min-width:0}
.sk-print-title{font:800 20px/1.1 var(--sans)}
.sk-print-subtitle{font:600 14px/1.2 var(--sans);color:var(--ink-2);margin-top:3px}
.sk-print-sub{font:600 11px/1.4 var(--mono);color:var(--muted);margin-top:6px}
.sk-print-foot{display:flex;justify-content:flex-end;gap:16px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.sk-print-by{font:700 11px var(--mono);color:var(--ink-2)}
.sk-print-fp{font:600 10px var(--mono);color:var(--muted);word-break:break-all}
.currency-chase{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.chase-note{flex:1;min-width:180px;font-size:12.5px;line-height:1.45;color:var(--muted)}
.chase-btn{background:var(--steel);color:#fff;min-height:42px;font-size:13px}
.supplier-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 16px}
.supplier-btn{min-height:58px;padding:0 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--hivis);border-radius:2px;font:700 14px/1.2 var(--sans);color:var(--ink);text-align:left;cursor:pointer}
.supplier-btn:hover{background:#fff;border-left-color:var(--steel)}
.supplier-custom{display:flex;gap:8px;margin-bottom:18px}
.supplier-in{flex:1;padding:12px 14px;font-size:14px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink)}
.supplier-go{background:var(--steel);color:#fff;min-height:46px}
.supplier-disclaimer{font-size:12.5px;line-height:1.5;color:var(--muted);background:var(--paper);border-left:3px solid var(--red);padding:12px 14px}
@media (min-width:620px){ .supplier-grid{grid-template-columns:repeat(3,1fr)} }
/* laptops + Surface: use the width, keep every target touch-sized */
@media (min-width:920px){
  #app{max-width:1120px;padding:0 32px 84px}
  .topbar{margin:0 -32px;padding:14px 32px}
  .headline{padding:26px 30px 22px}
  .headline-main{font-size:24px}
  .row{align-items:center}
  .cell{padding:15px 20px}
  .cell-float{min-width:116px}
  .float-num{font-size:24px}
  .cell-act{padding-left:22px}
  .act-name{font-size:16px}
  .cell-light{min-width:92px}
  .cell-drop{min-width:88px}
  .lite{width:20px;height:20px}
  .band{min-height:50px;font-size:16px}
  .look-head{margin-bottom:12px}
  .gate,.import{padding:40px 44px}
}
@media (min-width:1240px){ #app{max-width:1200px} }
@media (max-width:560px){
  .headline-main{font-size:18px}
  .row{flex-wrap:wrap} .cell-float{min-width:0;width:100%;flex-direction:row;gap:6px;align-items:baseline;border-right:none;border-bottom:1px solid var(--line)}
  .prog-name{max-width:30vw}
}
/* issue list (print / share to the men) */
.look-issue{background:transparent;color:var(--steel);border:1px solid var(--steel);min-height:38px;font-size:13px;font-weight:700}
.issue-overlay{position:fixed;inset:0;background:rgba(28,33,38,.62);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:60}
.issue-sheet{max-width:720px;width:100%;background:#fff;border:1px solid var(--line);padding:30px;margin:10px 0 40px}
.issue-head{border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:18px}
.issue-cap{font:600 12px/1.5 var(--mono);color:var(--muted);background:var(--paper);border-left:3px solid var(--steel);padding:9px 12px;margin-bottom:16px}
.issue-title{font:800 19px/1.1 var(--sans);letter-spacing:.04em}
.issue-sub{font:600 12px/1.5 var(--mono);color:var(--muted);margin-top:6px}
.issue-week{margin-bottom:18px}
.issue-week-label{font:700 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--steel);padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:8px}
.issue-line{display:grid;grid-template-columns:54px 1fr auto;gap:3px 12px;padding:9px 0;border-bottom:1px dotted var(--line);align-items:baseline}
.il-date{grid-row:1;grid-column:1;font:700 12px/1.3 var(--mono);color:var(--ink)}
.il-main{grid-row:1;grid-column:2;font-size:14px;line-height:1.3}
.il-id{font:700 12px/1 var(--mono);background:var(--paper);border:1px solid var(--line);padding:1px 4px;border-radius:2px}
.il-crit{font:800 10px/1 var(--mono);color:var(--red);letter-spacing:.06em}
.il-float{grid-row:1;grid-column:3;font:600 11px/1 var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.il-status{grid-row:2;grid-column:2;font:600 12px/1.4 var(--mono);color:var(--ink-2)}
.il-held{grid-row:3;grid-column:2;font:600 11px/1 var(--mono);color:var(--steel)}
.issue-driving .il-id{color:var(--red);border-color:var(--red)}
.issue-frame{margin-top:20px;padding-top:14px;border-top:2px solid var(--ink);font-size:11px;line-height:1.55;color:var(--muted)}
.issue-bar{display:flex;gap:8px;margin-top:22px;justify-content:flex-end;flex-wrap:wrap}
.issue-bar .btn-ghost{color:var(--ink);border-color:var(--line)}
/* chase list — bespoke notes cards */
.chase-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--steel);padding:14px 16px;margin-bottom:12px}
.chase-card.chase-blocked{border-left-color:var(--red)}
.chase-card.chase-critical{border-left-color:var(--red)}
.chase-card.chase-gating{border-left-color:var(--amber)}
.chase-card.chase-custom{border-left-color:var(--hivis)}
.chase-top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.chase-id{font:700 13px/1 var(--mono);background:var(--paper);border:1px solid var(--line);padding:3px 6px;border-radius:2px}
.chase-name{font-size:15px;font-weight:700;color:var(--ink);flex:1;min-width:140px}
.chase-meta{font:600 12px/1.4 var(--mono);color:var(--muted);margin-bottom:4px}
.chase-items{font:600 13px/1.45 var(--mono);color:var(--ink-2);margin:6px 0 10px;padding:8px 10px;background:var(--paper);border-left:3px solid var(--amber)}
.chase-lab{font:800 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chase-action{margin-top:10px;padding:12px 14px;border-radius:2px;border:1px solid rgba(192,57,43,.28);background:rgba(192,57,43,.08);transition:background .15s,border-color .15s}
.chase-action.is-done{border-color:rgba(39,174,96,.45);background:rgba(39,174,96,.12)}
.chase-status{font:800 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
.chase-status.open{color:var(--red)}
.chase-status.done{color:var(--green)}
.chase-when{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chase-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:2px;background:#fff;font:600 12px/1 var(--mono);color:var(--ink-2);cursor:pointer;user-select:none}
.chase-chip input{margin:0;accent-color:var(--steel)}
.chase-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chase-chip.urgent.on{background:var(--red);border-color:var(--red);color:#fff}
.chase-notes{width:100%;min-height:56px;padding:10px 12px;font:400 14px/1.45 var(--sans);border:1px solid rgba(192,57,43,.28);border-radius:2px;background:#fff;color:var(--ink);resize:vertical}
.chase-action.is-done .chase-notes{border-color:rgba(39,174,96,.4)}
.chase-notes:focus{outline:2px solid var(--steel);outline-offset:1px}
.chase-done-row{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08)}
.chase-done-lab{display:inline-flex;align-items:center;gap:8px;font:700 13px/1 var(--mono);color:var(--ink);cursor:pointer}
.chase-done-lab input{width:18px;height:18px;accent-color:var(--green)}
.chase-card.is-done{opacity:.78;border-left-color:var(--green)}.chase-card.is-done .chase-name{text-decoration:line-through;color:var(--muted)}
.chase-card-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
.chase-add{background:var(--paper);border:1px dashed var(--line);padding:16px;margin:16px 0}
.chase-add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chase-add-in{flex:1;min-width:140px;padding:10px 12px;font-size:14px;border:1px solid var(--line);border-radius:2px;background:#fff}
/* help */
.help-h{font:800 13px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.help-p{font-size:14px;line-height:1.6;color:var(--ink-2);margin:0 0 12px}
.help-p.blunt{font-weight:600;color:var(--ink)}
.help-list{margin:0 0 8px;padding:0;list-style:none}
.help-list li{font-size:14px;line-height:1.55;color:var(--ink-2);padding:9px 0 9px 22px;position:relative;border-bottom:1px dotted var(--line)}
.help-list li::before{content:"\2192";position:absolute;left:0;color:var(--steel);font-weight:700}
.gate-help,.import-help{background:transparent;color:var(--muted);border:1px solid var(--line);min-height:42px;margin-top:12px}
/* sketch-pad */
.sketch{max-width:760px;margin:0 auto}
.sketch-top{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.sketch-icon{width:40px;height:40px}
.sketch-h{font-size:26px;margin:6px 0 12px}
.sketch-note{font-size:14px;line-height:1.55;color:var(--muted);background:var(--surface);border-left:3px solid var(--steel);padding:12px 14px;margin-bottom:18px}
.sketch-title{width:100%;min-height:50px;padding:0 16px;font:700 17px/1 var(--sans);border:1px solid var(--line);background:#fff;margin-bottom:14px;border-radius:2px}
.sketch-editor{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.sketch-row{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:10px 12px;flex-wrap:wrap}
.sk-name{flex:1;min-width:120px;min-height:44px;padding:0 12px;font-size:15px;border:1px solid var(--line);background:#fff;border-radius:2px}
.sk-len{width:60px;min-height:44px;padding:0 8px;font:700 15px/1 var(--mono);border:1px solid var(--line);background:#fff;text-align:center;border-radius:2px}
.sk-unit{font:600 12px/1 var(--mono);color:var(--muted)}
.sk-place{min-height:44px;padding:0 8px;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:2px}
.sk-first{font:600 12px/1 var(--mono);color:var(--muted);padding:0 6px}
.sk-del{width:38px;min-height:38px;background:transparent;border:1px solid var(--line);color:var(--red);font:700 18px/1 var(--sans);border-radius:2px;cursor:pointer}
.sketch-add{background:var(--ink);color:#fff;min-height:46px;margin-bottom:18px}
.sketch-max{font:600 13px/1.4 var(--mono);color:var(--muted);margin-bottom:18px}
.sketch-chart{background:#fff;border:1px solid var(--line);border-radius:2px;margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:0 1px 0 rgba(28,33,38,.04)}
.sketch-chart svg{display:block}
.sketch-sheet{max-width:980px}
.sketch-sheet .sketch-chart{overflow:visible;border:none;box-shadow:none}
.sketch-sheet .sketch-chart svg{width:100%;height:auto;max-width:100%}
@media print{.sketch-chart{overflow:visible;border:none;box-shadow:none}.sketch-chart svg{width:100%;height:auto}}
.sketch-empty{color:var(--muted);font-size:14px;text-align:center;padding:28px 16px}
.sketch-saved-h{font:800 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.sketch-saved-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.sketch-saved-open{flex:1;text-align:left;background:var(--surface);border:1px solid var(--line);min-height:44px;padding:0 14px;font:600 14px/1 var(--sans);cursor:pointer;border-radius:2px}
.issue-fp{margin-top:12px;font:600 10px/1.5 var(--mono);color:var(--muted);word-break:break-all;background:var(--paper);padding:8px 10px;border:1px solid var(--line)}
@media print{
  body{background:#fff} body::before{display:none}
  #app>*:not(.issue-overlay){display:none !important}
  .issue-overlay{position:static !important;background:#fff !important;padding:0 !important;display:block !important;overflow:visible !important}
  .issue-sheet{border:none !important;max-width:none;margin:0;padding:0}
  .issue-bar,.topbar,.bands,.btn{display:none !important}
}

<script>
/* ---- app/sketchpad.js ---- */
/* ============================================================================
 * Ripple Heads-Up — Quick Action Plan storage, layout + crypto
 * Storage: a fast localStorage working-cache, WRITTEN THROUGH to IndexedDB for
 * durable, large-capacity storage; on load it reconciles from IndexedDB so a
 * cleared cache is restored. Backups: real WebCrypto AES-GCM, key derived from
 * the user's passphrase with PBKDF2 (600k) — protection, not theatre.
 * The sketch itself has NO scheduling engine: it is not a site programme.
 * ========================================================================== */
(function (root) {
  'use strict';
  var KEY = 'rhu_sketches';
  var MAX = 20;
  var DB = 'rhu_db', STORE = 'sketches';

  /* ---- localStorage working-cache (sync) ---- */

  function lsWrite(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }

  function idbAll() {

      if (!db) return [];

    });
  }
  function reconcile() {
    return idbAll().then(function (durable) {
      if (!durable || !durable.length) return;
      var cache = lsAll(), byId = {}; cache.forEach(function (s) { byId[s.id] = true; });
      var merged = cache.slice(); durable.forEach(function (s) { if (!byId[s.id]) merged.push(s); });

  /* ---- public storage API (sync cache + write-through to IndexedDB) ---- */
  function load() { return lsAll(); }

  function layout(activities) {
    var bars = [], prev = null;
    (activities || []).slice(0, MAX).forEach(function (a) {
      var len = Math.max(1, parseInt(a.length, 10) || 1);
      var start;

      else if (a.placement === 'before') start = Math.max(0, prev.start - len);
      else start = prev.start + prev.length;

<script>
/* ---- app/selftest.js ---- */
/* ============================================================================
 * Ripple Heads-Up — user-runnable self-test (architecture rule 4: must be able to FAIL)
 * Drives a KNOWN-ANSWER programme through the whole live pipeline and checks the
 * results the foreman actually relies on. If any engine drifts, this goes red.
 * Known answer: 5-task programme, FS chain T1->T2->T3 at zero float = the driving

 * ========================================================================== */

    '<Calendars><Calendar><UID>1</UID><Name>Standard</Name><IsBaseCalendar>1</IsBaseCalendar>',
    '<WeekDays>',
    '<WeekDay><DayType>2</DayType><DayWorking>1</DayWorking></WeekDay>',
    '<WeekDay><DayType>7</DayType><DayWorking>0</DayWorking></WeekDay>',
    '</WeekDays></Calendar></Calendars>',
    '<Tasks>',
    task(1, 'Groundworks', d(1), d(5), 40, 0, []),            // driving chain, zero float
    task(2, 'Foundations', d(8), d(12), 40, 0, [1]),
    task(3, 'Slab', d(15), d(19), 40, 0, [2]),
    task(4, 'Site cabin', d(8), d(10), 24, 9600, [1]),          // off-path, 2 days float (9600 tenths = 16h)

      ck('Held-by resolved (task 2 held by 1)', (function () { var r = m.lookahead.bands[8].rows.find(function (x) { return x.id === '2'; }); return r && String(r.heldBy) === '1'; })());

      ck('provenance recorded for every slot', ['schedule', 'logic', 'driving', 'lookahead', 'makeReady'].every(function (s) { return m._provenance[s]; }));

  /* ---------- format detection ---------- */
  function detectKind(text, name) {
    // Microsoft Project XML (also the usual Asta Powerproject "Export to Microsoft Project" XML)
    if (/schemas\.microsoft\.com\/project/i.test(text)) return 'MSP';
    // Primavera P6 XER (Asta can also export XER)
    if (/ERMHDR|%T\s+TASK/.test(text)) return 'XER';
    // Primavera P6 XML — not supported as a native reader yet; fail closed with a clear message
    if (/xmlns\.oracle\.com\/Primavera|APIBusinessObjects/i.test(text)) {
      throw new Error('This looks like a Primavera P6 XML. Export from Asta as Microsoft Project XML, or from P6 as an XER, then load that.');

  function weekKey(s) { var d = pdateObj(s); if (!d) return 'zzz-undated'; var ws = region().weekStart, diff = (d.getDay() - ws + 7) % 7, m = new Date(d); m.setDate(d.getDate() - diff); return m.toISOString().slice(0, 10); }

  function chasePlanner(m) {

    var sec = el('section', 'look');

    // Header
    var head = el('div', 'look-head');
    var titleTxt = 'Next ' + state.band + ' weeks \u00b7 ' + kept.length + ' shown';

    actions.appendChild(chaseBtn);
    if (hiddenCount) {
      var toggleHidden = el('button', 'btn look-issue', state.showHidden ? 'Hide them again' : ('Show ' + hiddenCount + ' hidden'));

    sec.appendChild(head);

    sec.appendChild(el('div', 'lite-frame', 'Tap a task (or its light) \u2192 tick materials, crew, plant, access etc. that need looking into. Those ticks go to Chase list for you to itemise. Issue list is for the men. HIDE removes non-domain work from this list and from print.'));

    if (!band.rows.length) {
      sec.appendChild(el('div', 'empty', 'Nothing scheduled in this window. Widen the band or check the data date.'));
      return sec;
    }
    if (!kept.length && !state.showHidden) {
      sec.appendChild(el('div', 'empty', 'All activities in this window are hidden. Use \u201cShow ' + hiddenCount + ' hidden\u201d or \u201cRestore all\u201d above.'));
      return sec;
    }

    // Which rows to draw: kept always; hidden only when showHidden is on
    var toShow = state.showHidden ? band.rows : kept;
    var tbl = el('div', 'rows');
    toShow.forEach(function (r) {
      var isHidden = !!state.dropped[r.id];
      var light = lightFor(r.id);
      var row = el('div', 'row' + (r.driving ? ' row-driving' : '') + (isHidden ? ' row-dropped' : ''));

      var f = el('div', 'cell cell-float');

      f.appendChild(el('span', 'float-unit', r.floatDays == null ? '' : 'd float'));
      row.appendChild(f);

      // Activity name — CLICK opens the items-to-address note (same as original light tap)
      var mid = el('button', 'cell cell-act cell-act-btn' + (state.openNotes[r.id] ? ' is-open' : ''));
      mid.setAttribute && mid.setAttribute('type', 'button');
      mid.setAttribute && mid.setAttribute('aria-expanded', state.openNotes[r.id] ? 'true' : 'false');
      mid.setAttribute && mid.setAttribute('aria-label', 'Open items to address for ' + (r.name || r.id));
      mid.onclick = function () { toggleNote(r.id); };
      var nm = el('div', 'act-name');
      nm.appendChild(el('span', 'act-id', r.id));
      nm.appendChild(document.createTextNode('  ' + (r.name || '')));
      if (r.driving) nm.appendChild(el('span', 'driving-tag', 'DRIVING'));
      if (isHidden) nm.appendChild(el('span', 'dropped-tag', 'HIDDEN'));
      if (state.openNotes[r.id]) nm.appendChild(el('span', 'dropped-tag', 'OPEN'));
      mid.appendChild(nm);
      mid.appendChild(el('div', 'act-held', (r.start ? ('starts ' + fmtDay(r.start) + '  \u00b7  ') : '') + (r.heldBy ? ('held by ' + r.heldBy) : 'open start') + '  \u00b7  tap for items'));
      row.appendChild(mid);

      // HIDE / RESTORE — removes from list and from print (does NOT open the note)
      var dc = el('div', 'cell cell-drop');
      var db = el('button', 'btn-drop' + (isHidden ? ' on' : ''), isHidden ? 'Restore' : 'Hide');
      db.setAttribute && db.setAttribute('type', 'button');

      row.appendChild(dc);

      row.appendChild(lc);

      tbl.appendChild(row);
      if (state.openNotes[r.id]) tbl.appendChild(considerationNote(r.id));
    });
    sec.appendChild(tbl);
    return sec;
  }

  /* ---------- make-ready light + considerations (on every look-ahead row) ---------- */
  // Combined readiness: the programme logic AND the foreman's own constraint ticks.
  function lightFor(actId) {
    var mr = (state.model && state.model.makeReady) || {};
    var rd = (mr.readinessById || {})[actId] || { state: 'READY' };
    if (rd.state === 'BLOCKED') return { c: 'red', logic: rd };
    if (rd.state === 'ATTENTION') return { c: 'amber', logic: rd };
    // Ticks = items flagged for chase ("needs looking into"), not "cleared"
    if (flaggedConstraints(actId).length) return { c: 'amber', logic: rd };
    return { c: 'green', logic: rd };
  }

  // The note: states the fact, offers points to weigh, hands the call back. Never an instruction.
  // Opened by clicking the TASK NAME or the coloured light — same as the original app.
  function considerationNote(actId) {
    var info = lightFor(actId), rd = info.logic, t = state.ticks[actId] || {};
    var mr = (state.model && state.model.makeReady) || {};
    var constraints = mr.constraints || ['materials', 'approvals/info', 'crew', 'plant', 'space/access', 'external'];
    var wrap = el('div', 'row-note note-' + info.c);
    wrap.appendChild(el('div', 'note-head', info.c === 'green' ? 'Clear' : (info.c === 'red' ? 'Not ready' : 'Getting ready')));
    var body = el('p', 'note-body');
    if (rd.state === 'BLOCKED') {
      body.textContent = 'The programme shows ' + (rd.waitingOnName ? (rd.waitingOnName + ' (' + rd.waitingOn + ')') : ('activity ' + rd.waitingOn)) + ' hasn\u2019t started. That can hold up what\u2019s behind it. What you do about it is your call.';
    } else if (rd.state === 'ATTENTION') {
      body.textContent = 'The programme shows the job feeding this is still running. To be ready you\u2019d want materials, crew and access lined up so it can go when its turn comes. Your call when.';
    } else if (info.c === 'green') {
      body.textContent = 'Programme\u2019s clear \u2014 the work before this is done and you have not flagged anything for chase. Whether to start it now is your call.';
    } else {
      body.textContent = 'Programme\u2019s clear on logic. Tick any item below that needs looking into \u2014 materials, crew, plant, access and the rest. Those ticks go onto YOUR chase list so you can itemise what must be done. Your call.';
    }
    wrap.appendChild(body);
    var ticks = el('div', 'note-ticks');
    constraints.forEach(function (c) {
      var chip = el('button', 'tick' + (t[c] ? ' tick-on' : ''), c);
      chip.title = t[c] ? 'Flagged for chase \u2014 click to clear' : 'Click to flag for chase';
      chip.onclick = function (ev) {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        state.ticks[actId] = state.ticks[actId] || {};
        state.ticks[actId][c] = !state.ticks[actId][c];
        render();
      };
      ticks.appendChild(chip);
    });
    wrap.appendChild(ticks);
    if (flaggedConstraints(actId).length) {
      wrap.appendChild(el('div', 'note-foot', 'Flagged for chase: ' + flaggedConstraints(actId).join(', ') + ' \u2014 open Chase list to itemise.'));
    } else {
      wrap.appendChild(el('div', 'note-foot', 'Your call \u2014 never the app\u2019s.'));
    }
    return wrap;
  }

  function toggleNote(actId) {
    state.openNotes[actId] = !state.openNotes[actId];
    render();
  }

  /* ---------- issue list (print / share to the men) ---------- */
  function constraintList() {
    var mr = (state.model && state.model.makeReady) || {};
    return mr.constraints || ['materials', 'approvals/info', 'crew', 'plant', 'space/access', 'external'];
  }
  // Tick on the look-ahead = "needs looking into" → must appear on the CHASE list.
  // Unticked = not flagged (nothing to chase for that item).
  function flaggedConstraints(actId) {
    var t = state.ticks[actId] || {};
    return constraintList().filter(function (c) { return !!t[c]; });
  }
  function hasAnyTick(actId) {
    return flaggedConstraints(actId).length > 0;
  }
  // Kept for older call sites: "all clear" means nothing flagged for chase
  function openConstraints(actId) {
    return flaggedConstraints(actId);
  }
  function allConstraintsTicked(actId) {
    return flaggedConstraints(actId).length === 0;
  }

  // Issue-list status: programme facts first. Constraint detail only if the supervisor has started ticking.
  function statusWord(actId) {
    var l = lightFor(actId), rd = l.logic;
    if (rd.state === 'BLOCKED' || l.c === 'red') {
      return 'Not ready \u2014 waiting on ' + (rd.waitingOnName ? rd.waitingOnName + ' (' + rd.waitingOn + ')' : (rd.waitingOn || 'predecessor'));
    }
    if (rd.state === 'ATTENTION') {
      return 'Getting ready \u2014 gating work under way';
    }
    // Issue list for the men stays clean — supervisor flags belong on the chase list only
    return 'On the programme';
  }

  // Why an activity belongs on the CHASE list (null = does not belong)
  // Unticked constraints alone do NOT put routine work on the chase list —
  // that was why both lists looked the same.
  // Only the FRONTIER of a blocked chain goes on the chase list.
  // If A holds B holds C and A has not started, B and C are blocked by a blocked predecessor —
  // listing all three looks like duplicated activities. Chase the first gap only.
  function isFrontierBlocked(rd, readinessById) {
    if (!rd || rd.state !== 'BLOCKED') return false;
    var predId = rd.waitingOn;
    if (!predId) return true;
    var pred = readinessById[predId];
    // Predecessor also blocked → this activity is mid-chain, skip
    if (pred && pred.state === 'BLOCKED') return false;
    return true;
  }

  function heldCountInBand(holderId, bandRows) {
    var n = 0;
    (bandRows || []).forEach(function (r) {
      if (r.heldBy === holderId) n++;
    });
    return n;
  }

  function chaseReason(r, bandRows) {
    // CHASE LIST = only what YOU flagged on the look-ahead (materials, crew, plant…).
    // Programme blocked / gating / critical stay on the look-ahead and the issue list for the men.
    // They do NOT auto-flood this list — that mixed everything up.
    var flagged = flaggedConstraints(r.id);
    if (!flagged.length) return null;

    var mr = (state.model && state.model.makeReady) || {};
    var readinessById = mr.readinessById || {};
    var l = lightFor(r.id), rd = l.logic;
    var detail = 'To chase: ' + flagged.join(', ');

    // Programme context on the same card (extra, not a reason to include the row)
    if (rd.state === 'BLOCKED') {
      var wait = rd.waitingOnName
        ? (rd.waitingOnName + ' (' + rd.waitingOn + ')')
        : (rd.waitingOn || 'predecessor');
      detail += '  \u00b7  also waiting on ' + wait;
      if (isFrontierBlocked(rd, readinessById)) {
        var held = heldCountInBand(r.id, bandRows);
        if (held > 0) detail += '  \u00b7  holds ' + held + ' more in this window';
      }
      return { rank: 1, label: 'CHASE', detail: detail };
    }
    if (rd.state === 'ATTENTION') {
      detail += '  \u00b7  feeding work still running';
      return { rank: 2, label: 'CHASE', detail: detail };
    }
    if (r.driving) {
      detail += '  \u00b7  on critical path';
      return { rank: 3, label: 'CHASE', detail: detail };
    }
    return { rank: 4, label: 'CHASE', detail: detail };
  }

  function chaseRows(band) {
    var rows = activeRows(band);
    var seen = {};
    var out = [];
    rows.forEach(function (r) {
      if (seen[r.id]) return;
      var reason = chaseReason(r, rows);
      if (!reason) return;
      seen[r.id] = true;
      out.push(r);
    });
    out.sort(function (a, b) {
      var ra = chaseReason(a, rows), rb = chaseReason(b, rows);
      if (!ra || !rb) return 0;
      if (ra.rank !== rb.rank) return ra.rank - rb.rank;
      var fa = a.floatDays == null ? 1e9 : a.floatDays, fb = b.floatDays == null ? 1e9 : b.floatDays;
      return fa - fb;
    });
    return out;
  }

  function issueFingerprint(m, rows, kind) {
    var basis = 'RHU-' + (kind || 'LOOKAHEAD') + '|' + state.band + 'wk|' + (m.schedule.name || '') + '|dd:' + (m.schedule.dataDate || '') + '|src:' + (m.schedule.sourceHash || '') + '|' + rows.map(function (r) { return r.id + '@' + (r.start || '') + '/' + (r.floatDays == null ? '' : r.floatDays) + '/' + statusWord(r.id); }).join(';');
    return sha(basis);
  }

    sheet.appendChild(bar);

  }

  /* ---------- chase list (supervisor only — what is not ready yet) ---------- */
  function showChaseList(m) {

    function noteKey(id) { return String(id); }
    function normalizeNote(raw) {
      if (!raw) return { when: null, text: '', done: false };

  function issueText(m, rows) {

    rows.forEach(function (r) {

    });

    lines.push('Fingerprint SHA-256: ' + issueFingerprint(m, rows, 'LOOKAHEAD'));
    return lines.join('\n');
  }
  function formatChaseNote(raw) {
    if (!raw) return null;
    if (typeof raw === 'string') return raw.trim() ? { when: null, text: raw.trim(), done: false } : null;
    return {
      when: raw.when || null,
      text: (raw.text || '').trim(),
      done: !!raw.done
    };
  }
  function chaseText(m, rows) {
    var band = m.lookahead.bands[state.band];
    var allActive = activeRows(band);
    var whenLabel = { am: 'This AM', today: 'Today', urgent: 'Urgent', week: 'This week' };
    var lines = ['CHASE LIST',
      (m.schedule.name || 'Programme') + ' | next ' + state.band + ' weeks | data date ' + fmtDate(m.currency.dataDate) + ' | ' + fmtDate(new Date().toISOString()),
      'Bespoke chase list. Frontier gaps only. Not the gang board.', ''];
    rows.forEach(function (r) {
      var reason = chaseReason(r, allActive);
      if (!reason) return;
      var note = formatChaseNote(state.chaseNotes[String(r.id)]);
      lines.push(r.id + '  ' + (r.name || '') + (note && note.done ? '  [COMPLETED]' : ''));
      lines.push('  Items noted: ' + reason.detail);

  function escapeXml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function todayISO() { return new Date().toISOString().slice(0, 10); }

  // Professional short-range Gantt as SVG: two-tier week/day timescale, dotted day gridlines,
  // heavy week lines, weekend shading, row banding. Fixed pixel sizing so it can't collapse and
  // stays readable; the container scrolls sideways for longer plans.
  function sketchSVG(sketch) {
    var named = (sketch.activities || []).filter(function (a) { return (a.name || '').trim(); });
    var lay = window.RHU_SKETCH.layout(named);
    if (!lay.bars.length) return '';

    var start = pdateObj(sketch.startDate || todayISO()) || new Date();
    var weekStartDow = region().weekStart; // 1 Mon (UK), 0 Sun (Gulf/US)
    var offset = (start.getDay() - weekStartDow + 7) % 7;
    var gridStart = new Date(start.getTime() - offset * 864e5);
    var numDays = Math.ceil((offset + Math.max(lay.span, 1)) / 7) * 7;
    if (numDays < 7) numDays = 7;

    // Proportions tuned for a clean short-range Gantt
    var nameW = 200, rowH = 44, weekH = 26, dayRowH = 32, headerH = weekH + dayRowH;
    var bottomPad = 10, dayW = 42;
    var gridW = numDays * dayW;
    var svgW = nameW + gridW + 8;
    var svgH = headerH + lay.bars.length * rowH + bottomPad;
    var weekendDays = state.region === 'GULF' ? [5, 6] : [0, 6];
    var WD = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    var barH = 22;
    var d, x, dt, w;

    var s = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + svgW + ' ' + svgH +
      '" width="' + svgW + '" height="' + svgH +
      '" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">';

    // Background
    s += '<rect x="0" y="0" width="' + svgW + '" height="' + svgH + '" fill="#FFFFFF"/>';

    // Weekend column fills (body only)
    for (d = 0; d < numDays; d++) {
      dt = new Date(gridStart.getTime() + d * 864e5);
      if (weekendDays.indexOf(dt.getDay()) >= 0) {
        x = nameW + d * dayW;
        s += '<rect x="' + x.toFixed(1) + '" y="' + headerH + '" width="' + dayW +
          '" height="' + (svgH - headerH - bottomPad) + '" fill="#F0F3F5"/>';
      }
    }

    // Week header band + week boundary lines
    for (w = 0; w * 7 < numDays; w++) {
      x = nameW + w * 7 * dayW;
      var wS = new Date(gridStart.getTime() + w * 7 * 864e5);
      var fill = (w % 2 === 0) ? '#1C2126' : '#2C333A';
      s += '<rect x="' + x.toFixed(1) + '" y="0" width="' + (dayW * 7) + '" height="' + weekH + '" fill="' + fill + '"/>';
      s += '<text x="' + (x + dayW * 3.5).toFixed(1) + '" y="' + (weekH / 2 + 4.5) +
        '" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.04em">' +
        'WEEK ' + (w + 1) + '  ·  W/C ' + ('0' + wS.getDate()).slice(-2) + ' ' + MONTHS[wS.getMonth()] + '</text>';
      // Strong week boundary through the grid
      s += '<line x1="' + x.toFixed(1) + '" y1="' + weekH + '" x2="' + x.toFixed(1) +
        '" y2="' + (svgH - bottomPad) + '" stroke="#C6CDD2" stroke-width="1.25"/>';
    }

    // Day header row + light day grid lines
    s += '<rect x="' + nameW + '" y="' + weekH + '" width="' + gridW + '" height="' + dayRowH + '" fill="#F5F7F8"/>';
    for (d = 0; d < numDays; d++) {
      dt = new Date(gridStart.getTime() + d * 864e5);
      x = nameW + d * dayW;
      // Light vertical day line (skip on week starts — already drawn stronger)
      if (d % 7 !== 0) {
        s += '<line x1="' + x.toFixed(1) + '" y1="' + headerH + '" x2="' + x.toFixed(1) +
          '" y2="' + (svgH - bottomPad) + '" stroke="#E4E8EA" stroke-width="1"/>';
      }
      s += '<text x="' + (x + dayW / 2).toFixed(1) + '" y="' + (weekH + 12) +
        '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#5C666E">' + WD[dt.getDay()] + '</text>';
      s += '<text x="' + (x + dayW / 2).toFixed(1) + '" y="' + (weekH + 25) +
        '" text-anchor="middle" font-size="12" font-weight="700" fill="#1C2126">' +
        ('0' + dt.getDate()).slice(-2) + '</text>';
    }

    // Frame lines
    s += '<line x1="0" y1="' + headerH + '" x2="' + svgW + '" y2="' + headerH +
      '" stroke="#1C2126" stroke-width="1.5"/>';
    s += '<line x1="' + nameW + '" y1="0" x2="' + nameW + '" y2="' + (svgH - bottomPad) +
      '" stroke="#1C2126" stroke-width="1.5"/>';
    s += '<line x1="' + (nameW + gridW) + '" y1="0" x2="' + (nameW + gridW) +
      '" y2="' + (svgH - bottomPad) + '" stroke="#C6CDD2" stroke-width="1"/>';
    s += '<line x1="0" y1="' + (svgH - bottomPad) + '" x2="' + svgW + '" y2="' + (svgH - bottomPad) +
      '" stroke="#C6CDD2" stroke-width="1"/>';

    // Name column header label
    s += '<text x="14" y="' + (headerH / 2 + 4) +
      '" font-size="10" font-weight="800" fill="#5C666E" letter-spacing="0.12em">ACTIVITY</text>';

    // Plan-start marker (vertical hi-vis line + small label)
    var sx = nameW + offset * dayW;
    s += '<line x1="' + sx.toFixed(1) + '" y1="' + headerH + '" x2="' + sx.toFixed(1) +
      '" y2="' + (svgH - bottomPad) + '" stroke="#F2A900" stroke-width="2"/>';
    s += '<rect x="' + (sx - 1).toFixed(1) + '" y="' + (headerH - 14) +
      '" width="2" height="14" fill="#F2A900"/>';

    // Rows + bars
    lay.bars.forEach(function (b, i) {
      var y = headerH + i * rowH;

      // Subtle row banding
      if (i % 2 === 1) {
        s += '<rect x="0" y="' + y + '" width="' + svgW + '" height="' + rowH + '" fill="#FAFBFC"/>';
      }
      // Row baseline
      s += '<line x1="0" y1="' + (y + rowH) + '" x2="' + svgW + '" y2="' + (y + rowH) +
        '" stroke="#E9ECEE" stroke-width="1"/>';

      // Activity name (left column)
      var nm = b.name;
      if (nm.length > 30) nm = nm.slice(0, 29) + '\u2026';
      s += '<text x="14" y="' + (y + rowH / 2 + 4.5).toFixed(1) +
        '" font-size="13" font-weight="600" fill="#1C2126">' + escapeXml(nm) + '</text>';

      // Bar geometry
      var bx = nameW + (offset + b.start) * dayW;
      var bw = Math.max(b.length * dayW - 3, 12); // small gap between adjacent bars
      var by = y + (rowH - barH) / 2;
      var hex = colourHex(b.colour);

      // Soft drop shadow (simple offset rect)
      s += '<rect x="' + (bx + 1.5).toFixed(1) + '" y="' + (by + 2).toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + barH + '" rx="4" fill="rgba(28,33,38,0.12)"/>';

      // Main bar
      s += '<rect x="' + bx.toFixed(1) + '" y="' + by.toFixed(1) +
        '" width="' + bw.toFixed(1) + '" height="' + barH + '" rx="4" fill="' + hex + '"/>';

      // Top highlight for depth
      s += '<rect x="' + (bx + 1.5).toFixed(1) + '" y="' + (by + 1.5).toFixed(1) +
        '" width="' + Math.max(bw - 3, 0).toFixed(1) + '" height="4" rx="2" fill="rgba(255,255,255,0.22)"/>';

      // Duration label — inside the bar when wide enough, otherwise to the right
      var durLabel = b.length + 'd';
      if (bw >= 36) {
        s += '<text x="' + (bx + bw / 2).toFixed(1) + '" y="' + (by + barH / 2 + 4.5).toFixed(1) +
          '" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">' + durLabel + '</text>';
      } else {
        s += '<text x="' + (bx + bw + 6).toFixed(1) + '" y="' + (y + rowH / 2 + 4.5).toFixed(1) +
          '" font-size="11" font-weight="700" fill="#5C666E">' + durLabel + '</text>';
      }
    });

    s += '</svg>';
    return s;
  }

  function drawChart() {
    var host = $('#sk-chart'); if (!host) return;
    var svg = sketchSVG(state.sketch);
    host.innerHTML = svg || '<div class="sketch-empty">Add a job to see the chart.</div>';
  }

  function sketchHash() {
    var payload = JSON.stringify({ title: state.sketch.title, subtitle: state.sketch.subtitle, preparedBy: state.sketch.preparedBy, startDate: state.sketch.startDate, activities: state.sketch.activities, savedAt: state.sketch.savedAt || 0 });
    try { return window.AMELIE_SHA256.sha256(payload); } catch (e) { return null; }
  }
  function saveCurrentSketch() {
    if (!state.sketch.title) state.sketch.title = 'Untitled plan';
    state.sketch.savedAt = Date.now();
    state.sketch.hash = sketchHash();
    state.sketch = window.RHU_SKETCH.saveSketch(state.sketch);
    showSketch();
  }
  function printSketch() {
    var overlay = el('div', 'issue-overlay'); var sheet = el('div', 'issue-sheet sketch-sheet');
    var head = el('div', 'sk-print-head');
    head.appendChild(iconEl('sk-print-icon'));
    var ht = el('div', 'sk-print-titles');
    ht.appendChild(el('div', 'sk-print-title', (state.sketch.title || 'Plan')));
    if (state.sketch.subtitle) ht.appendChild(el('div', 'sk-print-subtitle', state.sketch.subtitle));
    ht.appendChild(el('div', 'sk-print-sub', 'Supervisor\u2019s own plan \u2014 not the approved site programme   \u00b7   starts ' + fmtDate(state.sketch.startDate || todayISO()) + '   \u00b7   issued ' + fmtDate(new Date().toISOString())));
    head.appendChild(ht);
    sheet.appendChild(head);
    var chart = el('div', 'sketch-chart'); chart.innerHTML = sketchSVG(state.sketch) || ''; sheet.appendChild(chart);
    sheet.appendChild(el('div', 'issue-frame', 'This is the supervisor\u2019s own plan for a bit of work. It is not the approved site programme and it\u2019s no substitute for one. The approved programme runs the job.'));
    if (!state.sketch.savedAt) state.sketch.savedAt = Date.now();
    var hash = sketchHash();
    var foot = el('div', 'sk-print-foot');
    foot.appendChild(el('span', 'sk-print-by', 'Prepared by ' + (state.sketch.preparedBy || '\u2014')));
    if (hash) foot.appendChild(el('span', 'sk-print-fp', 'SHA-256 ' + hash));
    sheet.appendChild(foot);
    var bar = el('div', 'issue-bar');
    var pr = el('button', 'btn btn-primary', 'Print'); pr.onclick = function () { window.print(); }; bar.appendChild(pr);
    var cl = el('button', 'btn btn-ghost', 'Close'); cl.onclick = function () { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); }; bar.appendChild(cl);
    sheet.appendChild(bar);
    overlay.appendChild(sheet); $('#app').appendChild(overlay);
  }

  /* ---------- suppliers near you (opens the device's own map search; app fetches nothing) ---------- */
  var SUPPLIER_CATS = [
    ['Ready-mix concrete', 'ready-mix concrete supplier'],
    ['Scaffolding hire', 'scaffolding hire'],
    ['Plant & tool hire', 'plant hire tool hire'],
    ['Aggregates & sand', 'aggregates sand gravel supplier'],
    ['Steel & rebar', 'steel rebar supplier'],
    ['Timber & formwork', 'timber merchant formwork'],
    ['Builders merchant', 'builders merchant'],
    ['Welfare & cabins', 'site welfare cabin hire'],
    ['Skip & waste', 'skip hire waste'],
    ['Crane hire', 'crane hire'],
    ['Fuel & diesel', 'red diesel fuel supplier'],
    ['PPE & workwear', 'ppe workwear supplier']
  ];
  function openSupplierSearch(q) { try { window.open('https://www.google.com/maps/search/' + encodeURIComponent(q + ' near me'), '_blank'); } catch (e) {} }
  function showSuppliers() {
    var app = $('#app'); app.innerHTML = '';
    var wrap = el('div', 'gate suppliers');
    var back = el('button', 'btn gate-help sketch-back', '\u2190 Back'); back.onclick = function () { state.model ? render() : showGate(); }; wrap.appendChild(back);
    wrap.appendChild(iconEl('gate-icon'));
    wrap.appendChild(el('div', 'gate-eyebrow', 'Materials & plant'));
    wrap.appendChild(el('h1', 'gate-title', 'Suppliers near you'));
    wrap.appendChild(el('p', 'gate-lead', 'Pick what you\u2019re after and it opens a map search on your device for suppliers near you. Needs an internet connection.'));
    var grid = el('div', 'supplier-grid');
    SUPPLIER_CATS.forEach(function (c) { var b = el('button', 'supplier-btn', c[0]); b.onclick = function () { openSupplierSearch(c[1]); }; grid.appendChild(b); });
    wrap.appendChild(grid);
    var custRow = el('div', 'supplier-custom');
    var ci = el('input', 'supplier-in'); ci.type = 'text'; ci.setAttribute && ci.setAttribute('placeholder', 'Something else \u2014 type a material or service'); custRow.appendChild(ci);
    var cb = el('button', 'btn supplier-go', 'Search'); cb.onclick = function () { if (ci.value) openSupplierSearch(ci.value); }; custRow.appendChild(cb);
    wrap.appendChild(custRow);
    wrap.appendChild(el('div', 'supplier-disclaimer', 'This opens a public map search on your device. Ripple Heads-Up has no affiliation with any supplier, doesn\u2019t recommend or endorse any of them, and can\u2019t guarantee their goods, prices or service. Check anyone out yourself before you rely on them.'));
    app.appendChild(wrap);
  }

  /* ---------- sketch download / backup / restore ---------- */
  function note(msg) { try { if (window.alert) window.alert(msg); } catch (e) {} }
  function downloadFile(filename, content, mime) {
    try {
      var blob = new Blob([content], { type: mime || 'text/plain' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a'); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 800);
    } catch (e) {}
  }
  function sketchFileName(ext) {
    var t = (state.sketch.title || 'plan').replace(/[^a-z0-9]+/gi, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'plan';
    return t + '_' + (state.sketch.startDate || todayISO()) + '.' + ext;
  }
  function downloadChart() {
    var svg = sketchSVG(state.sketch); if (!svg) { note('Add a job first \u2014 there\u2019s nothing to download yet.'); return; }
    downloadFile(sketchFileName('svg'), '<?xml version="1.0" encoding="UTF-8"?>\n' + svg, 'image/svg+xml');
  }
  function backupSketch() {
    if (!window.RHU_SKETCH.hasWebCrypto()) { note('Encrypted backup needs a secure (https) context \u2014 not available from a plain file.'); return; }
    var pass = window.prompt && window.prompt('Set a passphrase to protect this backup.\nYou\u2019ll need it to restore \u2014 there is no way back without it.');
    if (!pass) return;
    window.RHU_SKETCH.encryptBackup(state.sketch, pass).then(function (cipher) { downloadFile(sketchFileName('rhu'), cipher, 'application/octet-stream'); }).catch(function () { note('Couldn\u2019t make the backup.'); });
  }
  function restoreBackup() {
    var input = document.createElement('input'); input.type = 'file'; input.accept = '.rhu,.json,application/json';
    input.onchange = function () {
      var f = input.files && input.files[0]; if (!f) return;
      var reader = new FileReader();
      reader.onload = function () {
        var text = reader.result, o;
        try { o = JSON.parse(text); } catch (e) { note('That doesn\u2019t look like a Ripple Heads-Up backup.'); return; }
        if (o && o.alg === 'AES-GCM-256') {
          var pass = window.prompt && window.prompt('Passphrase for this backup:'); if (!pass) return;
          window.RHU_SKETCH.decryptBackup(text, pass).then(function (sk) { state.sketch = sk; showSketch(); }).catch(function () { note('Wrong passphrase, or the backup is damaged.'); });
        } else { state.sketch = o; showSketch(); }
      };
      reader.readAsText(f);
    };
    input.click();
  }

  /* ---------- boot ---------- */
  document.addEventListener('DOMContentLoaded', function () { state.region ? showGate() : showRegionPick(); });
  window.__RIPPLE_UI = { showGate: showGate, loadText: function (text, name) { state.model = window.RIPPLE_CORE.run({ kind: detectKind(text, name), text: text, fileName: name, region: state.region || 'UK' }); render(); } };
})();

</script>
